
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1120">
  <title>مواعيدي</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function (OneSignal) {
      await OneSignal.init({
        appId: "b651cfee-cc1e-4a03-b54f-d996c3fab2a7",
        serviceWorkerPath: "/Mawaeedi/OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/Mawaeedi/" }
      });
    });
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1>📅 مواعيدي</h1>
      <p>نظّم يومك، موعدًا بعد موعد.</p>
      <button id="enable-notifications" type="button">🔔 تفعيل الإشعارات</button>
      <p id="notification-status">الإشعارات لم تُفعّل بعد.</p>
    </header>

    <section class="card" id="auth-section">
      <h2>تسجيل الدخول</h2>
      <form id="auth-form">
        <label for="auth-email">البريد الإلكتروني</label>
        <input type="email" id="auth-email" required autocomplete="email">

        <label for="auth-password">كلمة المرور</label>
        <input type="password" id="auth-password" minlength="6" required autocomplete="current-password">

        <button type="submit" id="login-button">تسجيل الدخول</button>
        <button type="button" id="signup-button">إنشاء حساب</button>
        <button type="button" id="logout-button" hidden>تسجيل الخروج</button>
        <p id="auth-status"></p>
      </form>
    </section>

    <section class="card">
      <h2>إضافة موعد جديد</h2>
      <form id="appointment-form">
        <label for="task">اسم الموعد</label>
        <input type="text" id="task" placeholder="مثال: مذاكرة الكيمياء" required>

        <label for="time">وقت الموعد</label>
        <input type="time" id="time" required>

        <button type="submit">حفظ الموعد</button>
      </form>
    </section>

    <section class="card">
      <h2>مواعيدي المحفوظة</h2>
      <div id="appointments">سجّل الدخول لعرض مواعيدك.</div>
    </section>
  </div>

  <script src="./script.js"></script>
</body>
</html>
