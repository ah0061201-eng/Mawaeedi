
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مواعيدي</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "b651cfee-cc1e-4a03-b54f-d996c3fab2a7",
      serviceWorkerPath: "OneSignalSDKWorker.js",
      serviceWorkerParam: {
        scope: "/Mawaeedi/"
      }
    });
  });
</script>
</head>

<body>
  <div class="container">
    <header>
  <h1>📅 مواعيدي</h1>
  <p>نظّم يومك، موعدًا بعد موعد.</p>
  <button id="enable-notifications" type="button">
    🔔 تفعيل الإشعارات
  </button>
  <p id="notification-status">الإشعارات لم تُفعّل بعد.</p>
</header>

    <section class="card">
      <h2>إضافة موعد جديد</h2>

      <form id="appointment-form">
        <label for="task">اسم المهمة</label>
        <input
          type="text"
          id="task"
          placeholder="مثال: مذاكرة الكيمياء"
          required
        >

        <label for="time">وقت الموعد</label>
        <input type="time" id="time" required>

        <button type="submit">حفظ الموعد</button>
      </form>
    </section>

    <section class="card">
      <h2>مواعيدي المحفوظة</h2>
      <div id="appointments">
        لا توجد مواعيد حتى الآن.
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
